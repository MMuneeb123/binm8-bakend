services:
  app:
    build: .
    container_name: binm8-backend-app
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-binm8_production}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-password}
    env_file:
      - .env
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - binm8-network

  postgres:
    image: postgres:14-alpine
    container_name: binm8-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-binm8_production}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - binm8-network

volumes:
  postgres_data:

networks:
  binm8-network:
    driver: bridge

